<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07110f">
  <title>看见正在发生的声音</title>
  <style>
    :root {
      --background: #07110f;
      --text: #edf9f4;
      --muted: #9badA5;
      --mint: #75e5c4;
      --line: rgba(182, 242, 220, 0.18);
      --panel: rgba(7, 18, 15, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .texture {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px);
      background-size: 5px 5px;
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: fixed;
      z-index: 2;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 30px;
      pointer-events: none;
    }

    .brand {
      font-size: 16px;
      font-weight: 700;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #586962;
      transition: 0.25s;
    }

    .status-dot.active {
      background: var(--mint);
      box-shadow: 0 0 14px var(--mint);
    }

    .sound-badge {
      position: fixed;
      z-index: 3;
      top: 50%;
      right: 30px;
      display: none;
      align-items: center;
      gap: 10px;
      transform: translateY(-50%);
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      backdrop-filter: blur(14px);
    }

    .sound-badge.visible {
      display: flex;
    }

    .badge-icon {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 12px var(--mint);
    }

    .caption {
      position: fixed;
      z-index: 4;
      bottom: 104px;
      left: 50%;
      width: min(720px, calc(100vw - 40px));
      transform: translateX(-50%);
      color: var(--text);
      text-align: center;
      font-size: clamp(19px, 2.4vw, 31px);
      font-weight: 600;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.72);
      transition: opacity 0.35s;
    }

    .caption.visible {
      opacity: 1;
    }

    .caption small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .controls {
      position: fixed;
      z-index: 5;
      bottom: 26px;
      left: 50%;
      display: flex;
      gap: 5px;
      transform: translateX(-50%);
      padding: 5px;
      border: 1px solid var(--line);
      background: rgba(7, 17, 14, 0.78);
      backdrop-filter: blur(14px);
    }

    .mode {
      min-width: 96px;
      min-height: 38px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0 13px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      transition: 0.2s;
    }

    .mode:hover {
      color: var(--text);
    }

    .mode.active {
      background: rgba(117, 229, 196, 0.18);
      color: var(--text);
    }

    .start-screen {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--background);
      transition: opacity 0.7s, visibility 0.7s;
    }

    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .start-content {
      width: min(570px, calc(100vw - 44px));
      text-align: center;
    }

    .start-content h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 70px);
      line-height: 1.13;
    }

    .start-content p {
      max-width: 380px;
      margin: 22px auto 30px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .start-button {
      min-width: 146px;
      min-height: 51px;
      border: 0;
      background: var(--mint);
      color: #052119;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
    }

    .start-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .error {
      min-height: 22px;
      margin-top: 15px;
      color: #ffbaaa;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 18px;
      }

      .sound-badge {
        top: auto;
        right: 18px;
        bottom: 91px;
        transform: none;
      }

      .controls {
        bottom: 18px;
      }

      .mode {
        min-width: 78px;
        padding: 0 9px;
      }

      .caption {
        bottom: 92px;
      }
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div class="texture"></div>

  <header class="topbar">
    <div class="brand">看见正在发生的声音</div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">等待感知</span>
    </div>
  </header>

  <aside class="sound-badge" id="soundBadge">
    <span class="badge-icon" id="badgeIcon"></span>
    <span id="badgeText">环境声音</span>
  </aside>

  <div class="caption" id="caption"></div>

  <nav class="controls" aria-label="声音视觉模式">
    <button class="mode active" data-mode="field">声场</button>
    <button class="mode" data-mode="rhythm">节奏</button>
    <button class="mode" data-mode="soundscape">静观声景</button>
  </nav>

  <section class="start-screen" id="startScreen">
    <div class="start-content">
      <h1>让声音<br>成为可见的存在</h1>
      <p>环境声音只会在当前浏览器中实时分析，不会被保存、上传或播放。</p>
      <button class="start-button" id="startButton">开始感知</button>
      <div class="error" id="errorMessage"></div>
    </div>
  </section>

  <script>
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    const getElement = (id) => document.getElementById(id);

    let audioContext;
    let analyser;
    let frequencyData;
    let timeData;
    let isRunning = false;
    let mode = "field";
    let previousEnergy = 0;
    let lastPulseTime = 0;
    let lastBadgeTime = 0;
    let speechActiveUntil = 0;
    let captionTimer;
    let animationTime = 0;

    const particles = [];
    const ripples = [];
    const wordParticles = [];

    const palettes = {
      field: ["#75e5c4", "#f4cf68", "#f18a75"],
      rhythm: ["#7de6d0", "#89b9ff", "#f4cf68"],
      soundscape: ["#8de2d2", "#aebdf5", "#e9cf87"]
    };

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    document.querySelectorAll(".mode").forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;

        document.querySelectorAll(".mode").forEach((item) => {
          item.classList.toggle("active", item === button);
        });

        const message = {
          field: "声场模式",
          rhythm: "节奏模式",
          soundscape: "静观声景模式"
        }[mode];

        showBadge(message, palettes[mode][0]);
      });
    });

    getElement("startButton").addEventListener("click", startExperience);

    async function startExperience() {
      const button = getElement("startButton");

      button.disabled = true;
      button.textContent = "正在连接麦克风...";
      getElement("errorMessage").textContent = "";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          }
        });

        audioContext = new (
          window.AudioContext || window.webkitAudioContext
        )();

        await audioContext.resume();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.76;

        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.fftSize);

        isRunning = true;

        getElement("startScreen").classList.add("hidden");
        getElement("statusDot").classList.add("active");
        getElement("statusText").textContent = "正在感知";

        showBadge("环境声音已连接", palettes.field[0]);
        startSpeechRecognition();
        requestAnimationFrame(render);
      } catch (error) {
        button.disabled = false;
        button.textContent = "重新尝试";

        getElement("errorMessage").textContent =
          "无法使用麦克风。请确认浏览器已允许此网站访问麦克风。";

        console.error(error);
      }
    }

    function startSpeechRecognition() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) return;

      const recognition = new SpeechRecognition();

      recognition.lang = "zh-CN";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let transcript = "";

        for (let index = event.resultIndex; index < event.results.length; index++) {
          transcript += event.results[index][0].transcript;
        }

        transcript = transcript.trim();

        if (!transcript) return;

        speechActiveUntil = Date.now() + 2200;

        showCaption(transcript);
        createWordParticles(transcript);
        showBadge("检测到人声", "#f4cf68");
      };

      recognition.onend = () => {
        if (isRunning) {
          try {
            recognition.start();
          } catch (_) {}
        }
      };

      recognition.onerror = () => {};

      try {
        recognition.start();
      } catch (_) {}
    }

    function showCaption(text) {
      getElement("caption").innerHTML =
        "“" + escapeHtml(text) + "”" +
        "<small>人声正被转化为可见文字</small>";

      getElement("caption").classList.add("visible");

      clearTimeout(captionTimer);

      captionTimer = setTimeout(() => {
        getElement("caption").classList.remove("visible");
      }, 4000);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (character) => {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return entities[character];
      });
    }

    function showBadge(text, color) {
      getElement("badgeText").textContent = text;
      getElement("badgeIcon").style.background = color;
      getElement("badgeIcon").style.boxShadow = "0 0 14px " + color;
      getElement("soundBadge").classList.add("visible");

      lastBadgeTime = Date.now();
    }

    function getAverageFrequency(start, end) {
      let total = 0;

      for (let index = start; index < end; index++) {
        total += frequencyData[index];
      }

      return total / Math.max(1, end - start) / 255;
    }

    function analyzeSound() {
      analyser.getByteFrequencyData(frequencyData);
      analyser.getByteTimeDomainData(timeData);

      let sum = 0;

      for (const value of timeData) {
        const normalized = (value - 128) / 128;
        sum += normalized * normalized;
      }

      const energy = Math.min(1, Math.sqrt(sum / timeData.length) * 6);
      const length = frequencyData.length;

      return {
        energy,
        low: getAverageFrequency(1, Math.floor(length * 0.08)),
        mid: getAverageFrequency(
          Math.floor(length * 0.08),
          Math.floor(length * 0.32)
        ),
        high: getAverageFrequency(
          Math.floor(length * 0.32),
          Math.floor(length * 0.82)
        )
      };
    }

    function detectSoundEvents(sound) {
      const now = Date.now();
      const energyJump = sound.energy - previousEnergy;

      if (
        energyJump > 0.21 &&
        sound.energy > 0.18 &&
        now - lastPulseTime > 260
      ) {
        lastPulseTime = now;

        ripples.push({
          x: window.innerWidth * (0.3 + Math.random() * 0.4),
          y: window.innerHeight * (0.3 + Math.random() * 0.4),
          radius: 8,
          speed: 4 + sound.energy * 9,
          life: 1,
          color: palettes[mode][1]
        });

        if (navigator.vibrate) {
          navigator.vibrate(20);
        }

        if (sound.high > sound.low * 1.3) {
          showBadge("短促细节声", "#f4cf68");
        } else if (sound.low > sound.mid * 1.15) {
          showBadge("低频脉冲", "#f18a75");
        } else {
          showBadge("声音变化", palettes[mode][0]);
        }
      }

      if (now > speechActiveUntil && now - lastBadgeTime > 2700) {
        if (sound.energy < 0.035) {
          showBadge("相对安静", "#75e5c4");
        } else if (sound.high > sound.low * 1.42 && sound.energy < 0.24) {
          showBadge("细微环境声", "#aebdf5");
        } else if (sound.low > sound.mid * 1.25) {
          showBadge("持续低频声", "#f18a75");
        } else if (sound.energy > 0.22) {
          showBadge("活跃声场", "#75e5c4");
        } else {
          showBadge("持续环境声", "#8de2d2");
        }
      }

      previousEnergy = previousEnergy * 0.84 + sound.energy * 0.16;
    }

    function createWordParticles(text) {
      const characters = Array.from(text).slice(0, 22);
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight * 0.48;

      characters.forEach((character, index) => {
        wordParticles.push({
          character,
          x: centerX + (index - characters.length / 2) * 15,
          y: centerY + (Math.random() - 0.5) * 34,
          velocityX: (Math.random() - 0.5) * 2,
          velocityY: -0.3 - Math.random() * 1.4,
          size: 18 + Math.random() * 15,
          life: 1,
          color: index % 2 === 0 ? "#dffcf1" : "#f4cf68"
        });
      });
    }

    function render() {
      if (!isRunning) return;

      animationTime += 0.012;

      const sound = analyzeSound();
      detectSoundEvents(sound);

      context.fillStyle =
        mode === "soundscape"
          ? "rgba(7, 15, 18, 0.11)"
          : "rgba(7, 17, 15, 0.16)";

      context.fillRect(0, 0, window.innerWidth, window.innerHeight);

      if (mode === "field") drawSoundField(sound);
      if (mode === "rhythm") drawRhythmField(sound);
      if (mode === "soundscape") drawSoundscape(sound);

      drawRipples();
      drawWordParticles();

      requestAnimationFrame(render);
    }

    function drawSoundField(sound) {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const radius = Math.min(window.innerWidth, window.innerHeight) * 0.13;
      const barCount = 128;
      const palette = palettes.field;

      for (let index = 0; index < barCount; index++) {
        const frequencyIndex = Math.floor(
          index / barCount * frequencyData.length
        );

        const value = frequencyData[frequencyIndex] / 255;
        const angle = index / barCount * Math.PI * 2 - Math.PI / 2;
        const coreRadius = radius + sound.energy * 42;
        const length = 10 + value * Math.min(window.innerWidth, window.innerHeight) * 0.22;

        context.globalAlpha = 0.15 + value * 0.78;
        context.strokeStyle = index % 13 === 0 ? palette[1] : palette[0];
        context.lineWidth = 1.5 + value * 2;

        context.beginPath();
        context.moveTo(
          centerX + Math.cos(angle) * coreRadius,
          centerY + Math.sin(angle) * coreRadius
        );
        context.lineTo(
          centerX + Math.cos(angle) * (coreRadius + length),
          centerY + Math.sin(angle) * (coreRadius + length)
        );
        context.stroke();
      }

      const particleCount = Math.floor(5 + sound.energy * 29);

      for (let index = 0; index < particleCount; index++) {
        particles.push({
          x: centerX + (Math.random() - 0.5) * radius,
          y: centerY + (Math.random() - 0.5) * radius,
          velocityX: (Math.random() - 0.5) * (1 + sound.energy * 5),
          velocityY: (Math.random() - 0.5) * (1 + sound.energy * 5),
          size: 1 + Math.random() * 3 + sound.high * 4,
          life: 1,
          color: palette[Math.floor(Math.random() * palette.length)]
        });
      }

      drawParticles();

      context.globalAlpha = 0.12 + sound.energy * 0.3;
      context.fillStyle = palette[0];
      context.beginPath();
      context.arc(
        centerX,
        centerY,
        radius * (0.72 + sound.energy * 0.85),
        0,
        Math.PI * 2
      );
      context.fill();

      context.globalAlpha = 1;
    }

    function drawRhythmField(sound) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const centerX = width / 2;
      const centerY = height / 2;
      const palette = palettes.rhythm;
      const baseline = height * 0.76;

      context.beginPath();
      context.moveTo(0, height);

      for (let x = 0; x <= width; x += 12) {
        const wave =
          Math.sin(x * 0.012 + animationTime * 3) * (18 + sound.low * 80) +
          Math.sin(x * 0.031 - animationTime * 2) * (8 + sound.mid * 35);

        context.lineTo(x, baseline + wave);
      }

      context.lineTo(width, height);
      context.closePath();
      context.globalAlpha = 0.25;
      context.fillStyle = palette[1];
      context.fill();

      for (let ring = 0; ring < 8; ring++) {
        const radius = 55 + ring * 27 + sound.energy * 75;

        context.globalAlpha = 0.08 + (8 - ring) * 0.018;
        context.strokeStyle = palette[ring % palette.length];
        context.lineWidth = ring % 3 === 0 ? 2 : 1;

        context.beginPath();
        context.arc(centerX, centerY, radius, 0, Math.PI * 2);
        context.stroke();
      }

      const orbitCount = Math.floor(15 + sound.energy * 70);

      for (let index = 0; index < orbitCount; index++) {
        const angle =
          animationTime * (0.7 + index % 3) + index * 0.48;
        const radius = 105 + (index % 5) * 31 + sound.energy * 95;

        context.globalAlpha = 0.15 + sound.high * 0.65;
        context.fillStyle = palette[index % palette.length];
        context.beginPath();
        context.arc(
          centerX + Math.cos(angle) * radius,
          centerY + Math.sin(angle) * radius * 0.58,
          1 + sound.high * 4,
          0,
          Math.PI * 2
        );
        context.fill();
      }

      context.globalAlpha = 1;
    }

    function drawSoundscape(sound) {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const palette = palettes.soundscape;
      const base = Math.min(window.innerWidth, window.innerHeight) * 0.12;
      const breath = (Math.sin(animationTime * 1.4) + 1) / 2;

      for (let index = 8; index >= 0; index--) {
        const radius =
          base +
          index * 33 +
          breath * 32 +
          sound.energy * 85;

        context.globalAlpha = 0.018 + (8 - index) * 0.012;
        context.fillStyle = palette[index % palette.length];
        context.beginPath();
        context.arc(centerX, centerY, radius, 0, Math.PI * 2);
        context.fill();
      }

      const detailCount = Math.floor(4 + sound.high * 38);

      for (let index = 0; index < detailCount; index++) {
        const angle =
          animationTime * (0.5 + index * 0.02) + index * 1.7;
        const radius = 80 + (index % 4) * 75 + sound.high * 130;
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius * 0.64;

        context.globalAlpha = 0.15 + sound.high * 0.58;
        context.fillStyle = palette[index % palette.length];
        context.beginPath();
        context.arc(x, y, 1.2 + sound.high * 6, 0, Math.PI * 2);
        context.fill();

        if (sound.high > 0.13 && Math.random() < 0.06) {
          ripples.push({
            x,
            y,
            radius: 3,
            speed: 1.8 + sound.high * 3,
            life: 0.55,
            color: palette[1]
          });
        }
      }

      context.globalAlpha = 1;
    }

    function drawParticles() {
      const visibleParticles = particles.filter(
        (particle) => particle.life > 0.02
      );

      particles.length = 0;
      particles.push(...visibleParticles);

      particles.forEach((particle) => {
        particle.x += particle.velocityX;
        particle.y += particle.velocityY;
        particle.velocityX *= 0.985;
        particle.velocityY *= 0.985;
        particle.life *= 0.965;

        context.globalAlpha = particle.life * 0.8;
        context.fillStyle = particle.color;
        context.beginPath();
        context.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );
        context.fill();
      });

      if (particles.length > 900) {
        particles.splice(0, 150);
      }

      context.globalAlpha = 1;
    }

    function drawRipples() {
      const activeRipples = ripples.filter((ripple) => ripple.life > 0.015);

      ripples.length = 0;
      ripples.push(...activeRipples);

      ripples.forEach((ripple) => {
        ripple.radius += ripple.speed;
        ripple.life *= 0.968;

        context.globalAlpha = ripple.life * 0.65;
        context.strokeStyle = ripple.color;
        context.lineWidth = 1.5;
        context.beginPath();
        context.arc(
          ripple.x,
          ripple.y,
          ripple.radius,
          0,
          Math.PI * 2
        );
        context.stroke();
      });

      context.globalAlpha = 1;
    }

    function drawWordParticles() {
      const visibleWords = wordParticles.filter((word) => word.life > 0.02);

      wordParticles.length = 0;
      wordParticles.push(...visibleWords);

      wordParticles.forEach((word) => {
        word.x += word.velocityX;
        word.y += word.velocityY;
        word.velocityX *= 0.988;
        word.velocityY *= 0.988;
        word.life *= 0.978;

        context.globalAlpha = word.life;
        context.fillStyle = word.color;
        context.font =
          "600 " +
          word.size +
          "px PingFang SC, Microsoft YaHei, sans-serif";
        context.textAlign = "center";
        context.fillText(word.character, word.x, word.y);
      });

      context.globalAlpha = 1;
    }
  </script>
</body>
