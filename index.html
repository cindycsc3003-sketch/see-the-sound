<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08110f">
  <title>看见正在发生的声音</title>
  <style>
    :root {
      --ink: #eaf8f1;
      --muted: #9baea7;
      --mint: #75e5c4;
      --glass: rgba(8, 18, 15, 0.58);
      --line: rgba(177, 241, 217, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #08110f;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px);
      background-size: 4px 4px;
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 30px;
      pointer-events: none;
    }

    .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #53635d;
      transition: 0.3s;
    }

    .status-dot.active {
      background: var(--mint);
      box-shadow: 0 0 14px var(--mint);
    }

    .sound-badge {
      position: fixed;
      z-index: 3;
      top: 50%;
      right: 30px;
      transform: translateY(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      font-size: 13px;
      backdrop-filter: blur(12px);
    }

    .sound-badge.visible { display: flex; }

    .badge-icon {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 12px var(--mint);
    }

    .caption {
      position: fixed;
      z-index: 4;
      left: 50%;
      bottom: 104px;
      width: min(720px, calc(100vw - 40px));
      transform: translateX(-50%);
      text-align: center;
      font-size: clamp(19px, 2.4vw, 31px);
      font-weight: 600;
      line-height: 1.45;
      opacity: 0;
      transition: opacity 0.4s;
      text-shadow: 0 2px 20px rgba(0,0,0,.7);
      pointer-events: none;
    }

    .caption.visible { opacity: 1; }

    .caption small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .controls {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--line);
      background: rgba(7, 17, 14, 0.75);
      backdrop-filter: blur(14px);
    }

    .mode {
      min-width: 90px;
      min-height: 37px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0 13px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      transition: 0.2s;
    }

    .mode:hover { color: var(--ink); }

    .mode.active {
      background: rgba(117, 229, 196, 0.18);
      color: var(--ink);
    }

    .start-screen {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      background: #08110f;
      transition: opacity 0.7s, visibility 0.7s;
    }

    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .start-content {
      width: min(570px, calc(100vw - 44px));
      text-align: center;
    }

    .start-content h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 70px);
      line-height: 1.13;
      letter-spacing: 0;
    }

    .start-content p {
      margin: 22px auto 30px;
      max-width: 365px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 14px;
    }

    .start-button {
      min-width: 146px;
      min-height: 51px;
      border: 0;
      background: var(--mint);
      color: #052119;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      font-size: 15px;
    }

    .start-button:disabled { opacity: .65; cursor: wait; }

    .error {
      min-height: 22px;
      margin-top: 15px;
      color: #ffb9aa;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .topbar { padding: 18px; }
      .sound-badge {
        top: auto;
        right: 18px;
        bottom: 91px;
        transform: none;
      }
      .controls { bottom: 18px; }
      .mode { min-width: 76px; padding: 0 9px; }
      .caption { bottom: 88px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="grain"></div>

  <header class="topbar">
    <div class="brand">看见正在发生的声音</div>
    <div class="status">
      <span class="status-dot" id="dot"></span>
      <span id="status">等待感知</span>
    </div>
  </header>

  <div class="sound-badge" id="badge">
    <span class="badge-icon" id="badgeIcon"></span>
    <span id="badgeText">环境声音</span>
  </div>

  <div class="caption" id="caption"></div>

  <nav class="controls" aria-label="视觉模式">
    <button class="mode active" data-mode="field">声场</button>
    <button class="mode" data-mode="music">音乐 / 节奏</button>
    <button class="mode" data-mode="calm">疗愈 / ASMR</button>
  </nav>

  <section class="start-screen" id="startScreen">
    <div class="start-content">
      <h1>让声音<br>成为可见的存在</h1>
      <p>麦克风声音仅在当前浏览器中实时分析，不会被保存、上传或播放。</p>
      <button class="start-button" id="startButton">开始感知</button>
      <div class="error" id="error"></div>
    </div>
  </section>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const $ = (id) => document.getElementById(id);

    let analyser;
    let audioContext;
    let frequencyData;
    let timeData;
    let active = false;
    let mode = "field";
    let previousEnergy = 0;
    let lastBeatAt = 0;
    let lastBadgeAt = 0;
    let speechUntil = 0;
    let captionTimer;
    let particles = [];
    let ripples = [];
    let words = [];
    let phase = 0;

    const colors = {
      field: ["#75e5c4", "#f4cf68", "#f18a75"],
      music: ["#7de6d0", "#89b9ff", "#f4cf68"],
      calm: ["#8de2d2", "#c1b6f7", "#edcf8a"]
    };

    function resize() {
      const ratio = Math.min(devicePixelRatio || 1, 2);
      canvas.width = innerWidth * ratio;
      canvas.height = innerHeight * ratio;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    addEventListener("resize", resize);
    resize();

    document.querySelectorAll(".mode").forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        document.querySelectorAll(".mode").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        showBadge(
          mode === "field" ? "声场模式" :
          mode === "music" ? "音乐与节奏模式" : "疗愈与细节模式",
          colors[mode][0]
        );
      });
    });

    $("startButton").addEventListener("click", start);

    async function start() {
      const button = $("startButton");
      button.disabled = true;
      button.textContent = "正在连接麦克风...";
      $("error").textContent = "";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.76;

        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.fftSize);
        active = true;

        $("startScreen").classList.add("hidden");
        $("dot").classList.add("active");
        $("status").textContent = "正在感知";
        showBadge("环境声音已连接", colors.field[0]);
        startSpeechRecognition();
        requestAnimationFrame(draw);
      } catch (error) {
        button.disabled = false;
        button.textContent = "重新尝试";
        $("error").textContent =
          "无法使用麦克风。请确认浏览器已允许该网站访问麦克风。";
        console.error(error);
      }
    }

    function startSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      const recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let text = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          text += event.results[i][0].transcript;
        }

        text = text.trim();
        if (!text) return;

        speechUntil = Date.now() + 2200;
        showSpeech(text);
        spawnWords(text);
        showBadge("人声", "#f4cf68");
      };

      recognition.onend = () => {
        if (active) {
          try { recognition.start(); } catch (_) {}
        }
      };

      recognition.onerror = () => {};

      try { recognition.start(); } catch (_) {}
    }

    function showSpeech(text) {
      $("caption").innerHTML =
        "“" + escapeHtml(text) + "”<small>正在将人声转化为可见文字</small>";
      $("caption").classList.add("visible");

      clearTimeout(captionTimer);
      captionTimer = setTimeout(() => {
        $("caption").classList.remove("visible");
      }, 4000);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function showBadge(text, color) {
      $("badgeText").textContent = text;
      $("badgeIcon").style.background = color;
      $("badgeIcon").style.boxShadow = "0 0 14px " + color;
      $("badge").classList.add("visible");
      lastBadgeAt = Date.now();
    }

    function getAverage(start, end) {
      let sum = 0;
      for (let i = start; i < end; i++) sum += frequencyData[i];
      return sum / Math.max(1, end - start) / 255;
    }

    function getSoundData() {
      analyser.getByteFrequencyData(frequencyData);
      analyser.getByteTimeDomainData(timeData);

      let rms = 0;
      for (const value of timeData) {
        const normalized = (value - 128) / 128;
        rms += normalized * normalized;
      }

      const energy = Math.min(1, Math.sqrt(rms / timeData.length) * 6);
      const count = frequencyData.length;
      const low = getAverage(1, Math.floor(count * 0.08));
      const mid = getAverage(Math.floor(count * 0.08), Math.floor(count * 0.32));
      const high = getAverage(Math.floor(count * 0.32), Math.floor(count * 0.82));

      return { energy, low, mid, high };
    }

    function detectEvents(data) {
      const now = Date.now();
      const jump = data.energy - previousEnergy;

      if (jump > 0.21 && data.energy > 0.18 && now - lastBeatAt > 260) {
        lastBeatAt = now;
        ripples.push({
          x: innerWidth * (0.28 + Math.random() * 0.44),
          y: innerHeight * (0.28 + Math.random() * 0.44),
          radius: 10,
          speed: 4 + data.energy * 9,
          life: 1,
          color: colors[mode][1]
        });

        if (navigator.vibrate) navigator.vibrate(20);

        if (data.high > data.low * 1.28) {
          showBadge("短促高频触点", "#f4cf68");
        } else if (data.low > data.mid * 1.12) {
          showBadge("低频脉冲", "#f18a75");
        } else {
          showBadge("节拍变化", colors[mode][0]);
        }
      }

      if (now > speechUntil && now - lastBadgeAt > 2600) {
        if (data.energy < 0.035) {
          showBadge("相对安静", "#75e5c4");
        } else if (data.high > data.low * 1.42 && data.energy < 0.24) {
          showBadge("细腻重复声", "#c1b6f7");
        } else if (data.low > data.mid * 1.25) {
          showBadge("低频持续声", "#f18a75");
        } else if (data.energy > 0.22) {
          showBadge("活跃声场", "#75e5c4");
        } else {
          showBadge("持续环境声", "#8de2d2");
        }
      }

      previousEnergy = previousEnergy * 0.84 + data.energy * 0.16;
    }

    function spawnWords(text) {
      const characters = Array.from(text).slice(0, 22);
      const centerX = innerWidth / 2;
      const centerY = innerHeight * 0.48;

      characters.forEach((character, index) => {
        words.push({
          text: character,
          x: centerX + (index - characters.length / 2) * 14,
          y: centerY + (Math.random() - 0.5) * 35,
          vx: (Math.random() - 0.5) * 1.9,
          vy: -0.3 - Math.random() * 1.5,
          size: 17 + Math.random() * 16,
          life: 1,
          color: index % 2 ? "#f4cf68" : "#dffcf1"
        });
      });
    }

    function draw() {
      if (!active) return;

      phase += 0.012;
      const data = getSoundData();
      detectEvents(data);

      ctx.fillStyle = mode === "calm"
        ? "rgba(7, 15, 18, 0.11)"
        : "rgba(8, 17, 15, 0.16)";
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      if (mode === "field") drawField(data);
      if (mode === "music") drawMusic(data);
      if (mode === "calm") drawCalm(data);

      drawRipples();
      drawWords();

      requestAnimationFrame(draw);
    }

    function drawField(data) {
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      const base = Math.min(innerWidth, innerHeight) * 0.13;
      const spectrumBars = 130;
      const currentColors = colors.field;

      for (let i = 0; i < spectrumBars; i++) {
        const index = Math.floor(i / spectrumBars * frequencyData.length);
        const value = frequencyData[index] / 255;
        const angle = i / spectrumBars * Math.PI * 2 - Math.PI / 2;
        const core = base + data.energy * 42;
        const length = 10 + value * Math.min(innerWidth, innerHeight) * 0.23;

        ctx.globalAlpha = 0.15 + value * 0.78;
        ctx.strokeStyle = i % 13 === 0 ? currentColors[1] : currentColors[0];
        ctx.lineWidth = 1.5 + value * 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * core, cy + Math.sin(angle) * core);
        ctx.lineTo(
          cx + Math.cos(angle) * (core + length),
          cy + Math.sin(angle) * (core + length)
        );
        ctx.stroke();
      }

      const count = Math.floor(6 + data.energy * 32);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: cx + (Math.random() - 0.5) * base,
          y: cy + (Math.random() - 0.5) * base,
          vx: (Math.random() - 0.5) * (1 + data.energy * 5),
          vy: (Math.random() - 0.5) * (1 + data.energy * 5),
          size: 1 + Math.random() * 3 + data.high * 4,
          life: 1,
          color: currentColors[Math.floor(Math.random() * currentColors.length)]
        });
      }

      drawParticles();
      ctx.globalAlpha = 0.14 + data.energy * 0.28;
      ctx.fillStyle = currentColors[0];
      ctx.beginPath();
      ctx.arc(cx, cy, base * (0.72 + data.energy * 0.85), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawMusic(data) {
      const width = innerWidth;
      const height = innerHeight;
      const currentColors = colors.music;
      const baseline = height * 0.76;

      ctx.beginPath();
      ctx.moveTo(0, height);

      for (let x = 0; x <= width; x += 12) {
        const wave =
          Math.sin(x * 0.012 + phase * 3) * (18 + data.low * 80) +
          Math.sin(x * 0.031 - phase * 2) * (8 + data.mid * 35);
        ctx.lineTo(x, baseline + wave);
      }

      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = currentColors[1];
      ctx.fill();

      const cx = width / 2;
      const cy = height / 2;
      const rings = 8;

      for (let ring = 0; ring < rings; ring++) {
        const radius = 55 + ring * 27 + data.energy * 75;
        ctx.globalAlpha = 0.08 + (rings - ring) * 0.018;
        ctx.strokeStyle = currentColors[ring % currentColors.length];
        ctx.lineWidth = ring % 3 === 0 ? 2 : 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      const orbitParticles = Math.floor(15 + data.energy * 70);
      for (let i = 0; i < orbitParticles; i++) {
        const angle = phase * (0.7 + i % 3) + i * 0.48;
        const radius = 105 + (i % 5) * 31 + data.energy * 95;
        ctx.globalAlpha = 0.15 + data.high * 0.65;
        ctx.fillStyle = currentColors[i % currentColors.length];
        ctx.beginPath();
        ctx.arc(
          cx + Math.cos(angle) * radius,
          cy + Math.sin(angle) * radius * 0.58,
          1 + data.high * 4,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function drawCalm(data) {
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      const currentColors = colors.calm;
      const breath = (Math.sin(phase * 1.4) + 1) / 2;
      const base = Math.min(innerWidth, innerHeight) * 0.12;

      for (let i = 8; i >= 0; i--) {
        const radius = base + i * 33 + breath * 32 + data.energy * 85;
        ctx.globalAlpha = 0.018 + (8 - i) * 0.012;
        ctx.fillStyle = currentColors[i % currentColors.length];
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      const touchCount = Math.floor(4 + data.high * 38);
      for (let i = 0; i < touchCount; i++) {
        const angle = phase * (0.5 + i * 0.02) + i * 1.7;
        const radius = 80 + (i % 4) * 75 + data.high * 130;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius * 0.64;

        ctx.globalAlpha = 0.15 + data.high * 0.58;
        ctx.fillStyle = currentColors[i % currentColors.length];
        ctx.beginPath();
        ctx.arc(x, y, 1.2 + data.high * 6, 0, Math.PI * 2);
        ctx.fill();

        if (data.high > 0.13 && Math.random() < 0.07) {
          ripples.push({
            x, y,
            radius: 3,
            speed: 1.8 + data.high * 3,
            life: 0.55,
            color: currentColors[1]
          });
        }
      }

      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      particles = particles.filter((particle) => particle.life > 0.02);

      particles.forEach((particle) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vx *= 0.985;
        particle.vy *= 0.985;
        particle.life *= 0.965;

        ctx.globalAlpha = particle.life * 0.8;
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if (particles.length > 900) particles.splice(0, 150);
      ctx.globalAlpha = 1;
    }

    function drawRipples() {
      ripples = ripples.filter((ripple) => ripple.life > 0.015);

      ripples.forEach((ripple) => {
        ripple.radius += ripple.speed;
        ripple.life *= 0.968;

        ctx.globalAlpha = ripple.life * 0.65;
        ctx.strokeStyle = ripple.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.globalAlpha = 1;
    }

    function drawWords() {
      words = words.filter((word) => word.life > 0.02);

      words.forEach((word) => {
        word.x += word.vx;
        word.y += word.vy;
        word.vx *= 0.988;
        word.vy *= 0.988;
        word.life *= 0.978;

        ctx.globalAlpha = word.life;
        ctx.fillStyle = word.color;
        ctx.font = "600 " + word.size + "px PingFang SC, Microsoft YaHei, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(word.text, word.x, word.y);
      });

      ctx.globalAlpha = 1;
    }
  </script>
</body>
</html>
