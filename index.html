<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#091313" />
  <title>看见正在发生的声音</title>
  <style>
    :root {
      --bg: #091313;
      --panel: rgba(13, 29, 28, 0.86);
      --line: rgba(163, 230, 211, 0.18);
      --text: #edf8f3;
      --muted: #9eb4ad;
      --mint: #6ee2c2;
      --yellow: #f1cb5d;
      --coral: #f2856d;
      --radius: 7px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        linear-gradient(rgba(140, 200, 179, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 200, 179, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 32px 32px;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1420px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 28px clamp(20px, 4vw, 56px);
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 290px;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #52655f;
      transition: 0.2s;
    }

    .dot.active {
      background: var(--mint);
      box-shadow: 0 0 16px var(--mint);
    }

    .side-title, .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .modes {
      display: grid;
      gap: 7px;
      align-content: start;
    }

    .mode {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 12px 11px;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      border-radius: var(--radius);
      font: inherit;
      transition: 0.2s;
    }

    .mode:hover { background: rgba(110, 226, 194, 0.07); color: var(--text); }
    .mode.active {
      color: var(--text);
      border-color: var(--line);
      background: rgba(110, 226, 194, 0.1);
    }

    .mode strong { display: block; font-size: 14px; margin-bottom: 4px; }
    .mode span { display: block; font-size: 12px; line-height: 1.45; }

    main {
      min-height: 490px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome { max-width: 620px; }
    .welcome h2 {
      margin: 0;
      font-size: clamp(29px, 4vw, 54px);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .welcome p {
      max-width: 420px;
      margin: 20px auto 28px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
    }

    .start {
      min-width: 142px;
      min-height: 49px;
      padding: 0 20px;
      border: 0;
      border-radius: 4px;
      background: var(--mint);
      color: #06201a;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
    }

    .start:hover { filter: brightness(1.08); }
    .start:disabled { opacity: 0.65; cursor: wait; }

    .live {
      display: none;
      width: min(700px, 100%);
    }

    .live.show { display: block; }

    .scene {
      margin: 0 0 14px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.2;
    }

    .scene-detail {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      min-height: 27px;
    }

    .meters {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: left;
    }

    .meter {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(7, 19, 18, 0.5);
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .bar {
      height: 5px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    .fill {
      width: 1%;
      height: 100%;
      background: var(--mint);
      transition: width 0.12s linear;
    }

    .right-panel {
      align-self: start;
      padding-left: 20px;
      border-left: 1px solid var(--line);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 38px;
    }

    .chip {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(110, 226, 194, 0.07);
      color: #d7eee5;
      font-size: 12px;
    }

    .timeline {
      margin-top: 27px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    .event {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(163, 230, 211, 0.09);
      color: #d2e2dc;
      font-size: 12px;
      line-height: 1.45;
    }

    .event time { color: var(--muted); font-variant-numeric: tabular-nums; }

    .caption {
      grid-column: 1 / -1;
      min-height: 58px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: #dff5ec;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.55;
    }

    .caption small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .permission-error {
      margin-top: 18px;
      color: #ffb5a4;
      line-height: 1.55;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(440px, 1fr) auto auto;
        gap: 18px;
        padding: 20px;
      }

      header { padding-bottom: 14px; }
      h1 { font-size: 20px; }
      .modes { grid-template-columns: repeat(3, 1fr); }
      .mode { padding: 9px; }
      .mode span { display: none; }
      main { min-height: 400px; }
      .right-panel {
        padding: 18px 0 0;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .caption { grid-column: auto; }
    }

    @media (max-width: 500px) {
      .status { font-size: 11px; }
      .meters { gap: 7px; }
      .meter { padding: 9px; }
      .meter-label { font-size: 10px; }
      .welcome h2 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <canvas id="visualizer"></canvas>

  <div class="shell">
    <header>
      <h1>看见正在发生的声音</h1>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">等待开始</span>
      </div>
    </header>

    <aside>
      <p class="side-title">感知方式</p>
      <nav class="modes">
        <button class="mode active" data-mode="see">
          <strong>看见声音</strong>
          <span>频谱、波形与声音粒子</span>
        </button>
        <button class="mode" data-mode="understand">
          <strong>读懂环境</strong>
          <span>字幕、事件与声音特征</span>
        </button>
        <button class="mode" data-mode="feel">
          <strong>感受声音</strong>
          <span>以呼吸、波纹和色带感知声音</span>
        </button>
      </nav>
    </aside>

    <main>
      <section class="welcome" id="welcome">
        <h2>环境并没有安静下来。<br>它正在变成光、节奏与触感。</h2>
        <p>使用麦克风实时分析环境声。声音不会被保存、上传或播放。</p>
        <button class="start" id="startButton">开始感知</button>
        <div class="permission-error" id="permissionError"></div>
      </section>

      <section class="live" id="live">
        <p class="eyebrow">当前环境</p>
        <h2 class="scene" id="sceneName">正在聆听</h2>
        <p class="scene-detail" id="sceneDetail">等待环境声音出现</p>

        <div class="meters">
          <div class="meter">
            <div class="meter-label"><span>声音强度</span><span id="volumeText">0%</span></div>
            <div class="bar"><div class="fill" id="volumeFill"></div></div>
          </div>
          <div class="meter">
            <div class="meter-label"><span>主导频段</span><span id="frequencyText">安静</span></div>
            <div class="bar"><div class="fill" id="frequencyFill"></div></div>
          </div>
          <div class="meter">
            <div class="meter-label"><span>节奏密度</span><span id="rhythmText">稀疏</span></div>
            <div class="bar"><div class="fill" id="rhythmFill"></div></div>
          </div>
        </div>
      </section>
    </main>

    <aside class="right-panel">
      <p class="side-title">声音特征推断</p>
      <div class="chips" id="chips">
        <span class="chip">等待声音输入</span>
      </div>

      <section class="timeline">
        <p class="side-title">最近发生</p>
        <div id="events">
          <div class="event"><time>--:--:--</time><span>尚未开始感知</span></div>
        </div>
      </section>
    </aside>

    <footer class="caption" id="caption">
      准备将环境中的声音转化为可见信息。
      <small>实时分析仅在当前设备的浏览器中进行</small>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");
    const $ = (id) => document.getElementById(id);

    let audioContext;
    let analyser;
    let source;
    let frequencyData;
    let timeData;
    let running = false;
    let mode = "see";
    let recognition;
    let lastEvent = 0;
    let lastVibrate = 0;
    let previousEnergy = 0;
    let beatCount = 0;
    let particles = [];
    let speechActiveUntil = 0;

    const palette = {
      see: ["#6ee2c2", "#f1cb5d", "#f2856d"],
      understand: ["#6ee2c2", "#a7d4ff", "#f1cb5d"],
      feel: ["#83dbd2", "#9cb3ff", "#e6c779"]
    };

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = innerWidth * ratio;
      canvas.height = innerHeight * ratio;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    document.querySelectorAll(".mode").forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        document.querySelectorAll(".mode").forEach((item) =>
          item.classList.toggle("active", item === button)
        );
        updateCaption();
      });
    });

    $("startButton").addEventListener("click", startExperience);

    async function startExperience() {
      const button = $("startButton");
      button.disabled = true;
      button.textContent = "正在连接麦克风...";
      $("permissionError").textContent = "";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.72;

        source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.fftSize);

        running = true;
        $("welcome").style.display = "none";
        $("live").classList.add("show");
        $("statusDot").classList.add("active");
        $("statusText").textContent = "正在实时感知";
        addEvent("已连接麦克风，开始感知环境");
        startSpeechRecognition();
        requestAnimationFrame(render);
      } catch (error) {
        button.disabled = false;
        button.textContent = "重新尝试";
        $("permissionError").textContent =
          "无法访问麦克风。请确认使用 HTTPS 链接，并在浏览器地址栏的网站权限中允许麦克风。";
        console.error(error);
      }
    }

    function startSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        $("caption").innerHTML =
          "当前浏览器不支持实时字幕。<small>建议在 Chrome 或 Edge 中使用“读懂环境”模式。</small>";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let text = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          text += event.results[i][0].transcript;
        }

        if (text.trim()) {
          speechActiveUntil = Date.now() + 1800;
          $("caption").innerHTML =
            "“" + escapeHtml(text.trim()) + "”<small>正在将识别到的人声转化为文字</small>";

          if (event.results[event.results.length - 1].isFinal) {
            addEvent("识别到人声：" + text.trim().slice(0, 24));
          }
        }
      };

      recognition.onerror = () => {};
      recognition.onend = () => {
        if (running) {
          try { recognition.start(); } catch (_) {}
        }
      };

      try { recognition.start(); } catch (_) {}
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function average(array, start, end) {
      let total = 0;
      for (let i = start; i < end; i++) total += array[i];
      return total / Math.max(1, end - start);
    }

    function analyzeSound() {
      analyser.getByteFrequencyData(frequencyData);
      analyser.getByteTimeDomainData(timeData);

      let rms = 0;
      for (const sample of timeData) {
        const normalized = (sample - 128) / 128;
        rms += normalized * normalized;
      }
      rms = Math.sqrt(rms / timeData.length);

      const size = frequencyData.length;
      const low = average(frequencyData, 1, Math.floor(size * 0.08)) / 255;
      const mid = average(frequencyData, Math.floor(size * 0.08), Math.floor(size * 0.34)) / 255;
      const high = average(frequencyData, Math.floor(size * 0.34), Math.floor(size * 0.8)) / 255;
      const energy = Math.min(1, rms * 6);

      const energyJump = energy - previousEnergy;
      if (energyJump > 0.18 && energy > 0.22) beatCount++;
      previousEnergy = previousEnergy * 0.85 + energy * 0.15;

      return { energy, low, mid, high };
    }

    function updateInterface(data) {
      const { energy, low, mid, high } = data;
      const voiceLikely = Date.now() < speechActiveUntil || (mid > low * 0.85 && mid > high * 0.9 && energy > 0.07);
      const softRepeated = energy > 0.04 && energy < 0.22 && high > low * 0.7;
      const dominant = low > mid && low > high ? "低频" : high > mid ? "高频" : "中频";
      const density = energy > 0.3 ? "密集" : energy > 0.1 ? "稳定" : "稀疏";

      $("volumeText").textContent = Math.round(energy * 100) + "%";
      $("volumeFill").style.width = Math.max(2, energy * 100) + "%";
      $("frequencyText").textContent = energy < 0.035 ? "安静" : dominant;
      $("frequencyFill").style.width = Math.max(2, Math.max(low, mid, high) * 100) + "%";
      $("rhythmText").textContent = density;
      $("rhythmFill").style.width = Math.max(2, energy * 100) + "%";

      const tags = [];
      if (energy < 0.035) tags.push("相对安静");
      if (voiceLikely) tags.push("可能存在人声");
      if (low > 0.2 && low > mid * 1.25) tags.push("低频节奏或机械震动");
      if (high > 0.18 && high > low * 1.35) tags.push("高频细节或敲击");
      if (softRepeated) tags.push("细腻重复声 / ASMR 特征");
      if (energy > 0.15 && low > 0.11 && mid > 0.11) tags.push("较丰富的声音层次");
      if (!tags.length) tags.push("持续环境声");

      $("chips").innerHTML = tags.slice(0, 4)
        .map((tag) => '<span class="chip">' + tag + "</span>")
        .join("");

      if (energy < 0.035) {
        $("sceneName").textContent = "相对安静";
        $("sceneDetail").textContent = "仍在捕捉细微、持续的环境变化";
      } else if (voiceLikely) {
        $("sceneName").textContent = "正在听见人声";
        $("sceneDetail").textContent = "字幕会在浏览器支持时实时出现";
      } else if (softRepeated) {
        $("sceneName").textContent = "细腻而重复的声音";
        $("sceneDetail").textContent = "适合以呼吸和颗粒的方式感受";
      } else if (energy > 0.28) {
        $("sceneName").textContent = "环境正在活跃";
        $("sceneDetail").textContent = "声音能量与节奏变化较明显";
      } else {
        $("sceneName").textContent = "持续的环境声";
        $("sceneDetail").textContent = dominant + "正在主导此刻的声音结构";
      }

      const now = Date.now();
      if (now - lastEvent > 4500 && energy > 0.12) {
        let label = voiceLikely ? "检测到可能的人声活动"
          : high > low * 1.4 ? "检测到高频敲击或细节声"
          : low > mid * 1.25 ? "检测到低频持续或节奏声"
          : "环境声音强度出现变化";
        addEvent(label);
        lastEvent = now;
      }

      if (energyJump > 0.25 && navigator.vibrate && now - lastVibrate > 900) {
        navigator.vibrate(28);
        lastVibrate = now;
      }

      updateCaption();
    }

    function updateCaption() {
      if (!running) return;
      if (mode === "see") {
        $("caption").innerHTML = "声音被拆解为强度、频段、节奏与运动。<small>光点越活跃，表示此刻声音能量越强</small>";
      } else if (mode === "understand") {
        $("caption").innerHTML = "用文字和事件记录理解正在发生的环境。<small>声音类别为特征推断，不代表绝对识别结果</small>";
      } else {
        $("caption").innerHTML = "让声音成为呼吸、波纹与缓慢变化的光。<small>这是感官体验，不构成医疗或心理治疗建议</small>";
      }
    }

    function addEvent(text) {
      const now = new Date();
      const time = now.toLocaleTimeString("zh-CN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });

      const event = document.createElement("div");
      event.className = "event";
      event.innerHTML = "<time>" + time + "</time><span>" + escapeHtml(text) + "</span>";
      $("events").prepend(event);

      while ($("events").children.length > 5) {
        $("events").lastElementChild.remove();
      }
    }

    function render() {
      if (!running) return;

      const data = analyzeSound();
      updateInterface(data);

      const width = innerWidth;
      const height = innerHeight;
      const colors = palette[mode];
      const centerX = width * 0.5;
      const centerY = height * 0.52;

      ctx.fillStyle = "rgba(9, 19, 19, 0.14)";
      ctx.fillRect(0, 0, width, height);

      if (mode === "see") drawSpectrum(data, centerX, centerY, colors);
      if (mode === "understand") drawWaveform(data, centerX, centerY, colors);
      if (mode === "feel") drawHealing(data, centerX, centerY, colors);

      requestAnimationFrame(render);
    }

    function drawSpectrum(data, x, y, colors) {
      const bars = 80;
      const radius = Math.min(innerWidth, innerHeight) * 0.14;

      for (let i = 0; i < bars; i++) {
        const value = frequencyData[Math.floor(i / bars * frequencyData.length)] / 255;
        const angle = (Math.PI * 2 * i) / bars - Math.PI / 2;
        const length = 12 + value * Math.min(innerWidth, innerHeight) * 0.2;
        const x1 = x + Math.cos(angle) * radius;
        const y1 = y + Math.sin(angle) * radius;
        const x2 = x + Math.cos(angle) * (radius + length);
        const y2 = y + Math.sin(angle) * (radius + length);

        ctx.strokeStyle = i % 8 === 0 ? colors[1] : colors[0];
        ctx.globalAlpha = 0.22 + value * 0.72;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      ctx.globalAlpha = 0.18 + data.energy * 0.35;
      ctx.fillStyle = colors[0];
      ctx.beginPath();
      ctx.arc(x, y, radius * (0.72 + data.energy * 0.5), 0, Math.PI * 2);
      ctx.fill();

      if (data.energy > 0.08 && Math.random() < data.energy * 0.8) {
        particles.push({
          x: x + (Math.random() - 0.5) * 80,
          y: y + (Math.random() - 0.5) * 80,
          vx: (Math.random() - 0.5) * (1 + data.energy * 4),
          vy: (Math.random() - 0.5) * (1 + data.energy * 4),
          life: 1,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      particles = particles.filter((particle) => particle.life > 0.02);
      particles.forEach((particle) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.life *= 0.965;
        ctx.globalAlpha = particle.life;
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, 1.5 + data.energy * 4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalAlpha = 1;
    }

    function drawWaveform(data, x, y, colors) {
      ctx.globalAlpha = 0.86;
      ctx.strokeStyle = colors[0];
      ctx.lineWidth = 2;
      ctx.beginPath();

      for (let i = 0; i < timeData.length; i++) {
        const px = i / (timeData.length - 1) * innerWidth;
        const py = y + ((timeData[i] - 128) / 128) * (55 + data.energy * 200);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();

      const steps = 18;
      for (let i = 0; i < steps; i++) {
        const radius = 35 + i * 24 + ((Date.now() / 60) % 24);
        ctx.globalAlpha = Math.max(0, 0.12 - i * 0.006) * (0.5 + data.energy);
        ctx.strokeStyle = i % 2 ? colors[1] : colors[0];
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawHealing(data, x, y, colors) {
      const time = Date.now() / 1000;
      const base = Math.min(innerWidth, innerHeight) * 0.13;
      const breath = Math.sin(time * 1.6) * 0.5 + 0.5;
      const layers = 7;

      for (let layer = layers; layer >= 0; layer--) {
        const radius = base + layer * 36 + breath * 20 + data.energy * 120;
        ctx.globalAlpha = 0.025 + (layers - layer) * 0.014;
        ctx.fillStyle = colors[layer % colors.length];
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 0.48;
      ctx.strokeStyle = colors[1];
      ctx.lineWidth = 1.5;
      ctx.beginPath();

      for (let i = 0; i <= 150; i++) {
        const angle = i / 150 * Math.PI * 2;
        const wave = Math.sin(angle * 5 + time * 2) * (8 + data.high * 55);
        const radius = base * 0.95 + wave + data.energy * 85;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  </script>
